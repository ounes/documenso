name: keylo-documenso

services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: password
      POSTGRES_DB: documenso
    volumes:
      - keylo_documenso_database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

  keylo-documenso:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./env.local
    ports:
      - '3003:3003'

volumes:
  keylo_documenso_database:
